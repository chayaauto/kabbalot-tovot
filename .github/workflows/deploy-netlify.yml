# Builds the React site and deploys it to Netlify on every push to main.
# Needs one repository secret: NETLIFY_AUTH_TOKEN (a Netlify personal access token).
name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 6a1369c3-7563-42d7-8df8-4424c53aa466
    steps:
      - uses: actions/checkout@v4

      - name: Check token
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Missing secret NETLIFY_AUTH_TOKEN. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        run: npx --yes netlify-cli@17.38.1 deploy --prod --dir=dist --site="$NETLIFY_SITE_ID" --message="GitHub ${GITHUB_SHA::7}"
